name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent:
    # The laptop sync agent and the data format it uploads (Python), and the Oracle VM's scripts (deploy/). The
    # website is the web job below.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Agent and data-format tests
        run: pytest

  web:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sla_web_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Java tests (in-memory database)
        run: ./mvnw -B test

      - name: Java tests (on MySQL)
        env:
          # CI-only throwaway database; not a real secret. Environment variables win over the test settings.
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sla_web_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./mvnw -B test

  image:
    # The website as Render builds it (render.yaml), so a broken Dockerfile shows here, not on the live site.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build the online site
        run: docker build web

  exe:
    # The app and the setup exactly as the release builds them (agent/packaging/build.py, PyInstaller's launcher
    # compiled here), then started (agent/packaging/smoke-test.ps1): a change that breaks them shows on the pull
    # request, not on release day.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install, with PyInstaller's launcher compiled here (fewer antivirus false alarms)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install -r requirements-dev.txt --no-binary=pyinstaller -r agent/packaging/requirements.txt

      - name: Build the app and the setup
        run: python agent/packaging/build.py

      - name: Start them
        run: ./agent/packaging/smoke-test.ps1
