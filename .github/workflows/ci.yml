name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_life_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # CI-only throwaway database; not a real secret.
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/school_life_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Migrations apply and roll back on MySQL
        env:
          SECRET_KEY: ci-only
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          flask db upgrade
          flask db downgrade base

      - name: Tests (on MySQL)
        run: pytest

  web:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sla_web_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Java tests (in-memory database)
        run: ./mvnw -B test

      - name: Java tests (on MySQL)
        env:
          # CI-only throwaway database; not a real secret. Environment variables win over the test settings.
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sla_web_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: ./mvnw -B test
