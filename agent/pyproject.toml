[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-agent"
version = "0.1.0"
description = "Laptop sync agent for School-Life-Assistant: reads EduSoft, uploads academic data"
requires-python = ">=3.12"
dependencies = [
    "sla-contract",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "keyring>=25,<26",
    "pywin32>=312; sys_platform == 'win32'",  # reads classic Outlook (Windows only)
]

[project.scripts]
sla-agent = "sla_agent.cli:main"

[tool.setuptools]
packages = ["sla_agent", "sla_agent.parsers"]
